[package]
name = "nit-system"
version.workspace = true
edition.workspace = true
description = "A fast local-first terminal notes and task manager"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
license.workspace = true
rust-version.workspace = true

[workspace]
members = [
    ".",
    "crates/nit-ai",
    "crates/nit-cli",
    "crates/nit-core",
    "crates/nit-drive",
    "crates/nit-editor",
    "crates/nit-session",
    "crates/nit-tui",
    "crates/nitcat",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ART3121/NIT-System"
homepage = "https://github.com/ART3121/NIT-System"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5.3"
chacha20poly1305 = "0.11.0"
crossterm = "0.29"
fs2 = "0.4"
getrandom = "0.4.3"
interprocess = "2.4.3"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
pulldown-cmark = "0.13"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rpassword = "7.5.4"
rustix = { version = "1.1.4", features = ["process"] }
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
unicode-width = "0.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
zeroize = "1.9.0"

[[bin]]
name = "nit"
path = "src/main.rs"

[[bin]]
name = "nitcat"
path = "src/bin/nitcat.rs"
doc = false

[dependencies]
anyhow.workspace = true
nit-cli = { path = "crates/nit-cli" }
nitcat = { path = "crates/nitcat" }

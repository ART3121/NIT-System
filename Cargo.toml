[package]
name = "nit-system"
version = "0.2.0"
edition = "2021"
description = "A fast local terminal note system"
repository = "https://github.com/ART3121/NIT-System"
homepage = "https://github.com/ART3121/NIT-System"
readme = "README.md"
license = "MIT"

[[bin]]
name = "nit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
ratatui = "0.29"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

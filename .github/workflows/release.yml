name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Verify tag and package version
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Cargo.toml version ($package_version) does not match tag ($GITHUB_REF_NAME)." >&2
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build optimized binary
        run: cargo build --release --locked

      - name: Package release assets
        shell: bash
        run: |
          asset="nit-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p dist/package
          install -m 755 target/release/nit dist/package/nit
          tar -C dist/package -czf "dist/$asset" nit
          (
            cd dist
            sha256sum "$asset" > "$asset.sha256"
          )
          install -m 755 install.sh dist/install.sh
          sh -n dist/install.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/nit-x86_64-unknown-linux-gnu.tar.gz \
            dist/nit-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            dist/install.sh \
            --title "NIT System $GITHUB_REF_NAME" \
            --generate-notes

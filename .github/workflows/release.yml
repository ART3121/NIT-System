name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Validate and build Linux release
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify tag and package version
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Cargo.toml version ($package_version) does not match tag ($GITHUB_REF_NAME)." >&2
            exit 1
          fi

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: cargo test --workspace --locked

      - name: Build optimized binary
        run: cargo build --workspace --release --locked

      - name: Package release assets
        shell: bash
        run: |
          target="x86_64-unknown-linux-gnu"
          mkdir -p dist/package dist/nit dist/nitcat
          install -m 755 target/release/nit dist/package/nit
          install -m 755 target/release/nitcat dist/package/nitcat
          install -m 644 LICENSE dist/package/LICENSE
          install -m 755 target/release/nit dist/nit/nit
          install -m 644 LICENSE dist/nit/LICENSE
          install -m 755 target/release/nitcat dist/nitcat/nitcat
          install -m 644 LICENSE dist/nitcat/LICENSE
          tar -C dist/package -czf "dist/nit-system-$target.tar.gz" nit nitcat LICENSE
          tar -C dist/nit -czf "dist/nit-$target.tar.gz" nit LICENSE
          tar -C dist/nitcat -czf "dist/nitcat-$target.tar.gz" nitcat LICENSE
          (
            cd dist
            for asset in nit-system-$target.tar.gz nit-$target.tar.gz nitcat-$target.tar.gz; do
              sha256sum "$asset" > "$asset.sha256"
            done
          )
          install -m 755 install.sh dist/install.sh
          sh -n dist/install.sh

      - name: Store validated release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nit-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nit-release-${{ github.ref_name }}
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/nit-system-x86_64-unknown-linux-gnu.tar.gz \
            dist/nit-system-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            dist/nit-x86_64-unknown-linux-gnu.tar.gz \
            dist/nit-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            dist/nitcat-x86_64-unknown-linux-gnu.tar.gz \
            dist/nitcat-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            dist/install.sh \
            --repo "$GITHUB_REPOSITORY" \
            --title "NIT System $GITHUB_REF_NAME" \
            --generate-notes
